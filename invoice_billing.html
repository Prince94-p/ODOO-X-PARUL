<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traveloop | Invoice & Billing</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.1.9/umd/Recharts.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    const { PieChart, Pie, Cell, ResponsiveContainer, Tooltip } = window.Recharts;

    const InvoiceBilling = () => {
      const [searchQuery, setSearchQuery] = useState("");

      const budgetData = [
        { name: 'Spent', value: 22000, color: '#ef4444' },
        { name: 'Remaining (Negative)', value: 0, color: '#e5e7eb' }, 
      ];

      const invoiceItems = [
        { id: 1, category: "hotel", desc: "hotel booking paris", qty: "3 nights", unit: "$3,000.00", amount: "$9,000.00" },
        { id: 2, category: "travel", desc: "flight bookings (DEL -> PAR)", qty: "1", unit: "$12,000.00", amount: "$12,000.00" },
      ];

      return (
        <div className="min-h-screen bg-gray-50 text-gray-800 flex flex-col pb-24">
          <header className="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6 shrink-0 sticky top-0 z-50 shadow-sm">
            <div className="flex items-center gap-2 cursor-pointer text-xl font-bold text-gray-900" onClick={() => window.location.href='dashboard.html'}>
              <i className="ph-fill ph-paper-plane-tilt text-blue-600"></i>
              <span>Traveloop</span>
            </div>
            
            <div className="hidden md:flex items-center gap-4 flex-1 max-w-2xl mx-8">
              <div className="relative w-full">
                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <i className="ph ph-magnifying-glass text-gray-400 text-lg"></i>
                </div>
                <input 
                  type="text" 
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search invoices..." 
                  className="w-full pl-10 pr-4 py-1.5 bg-gray-100 border-transparent rounded-md text-sm focus:bg-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                />
              </div>
              <div className="flex items-center gap-2 shrink-0">
                <button className="flex items-center gap-1.5 px-3 py-1.5 bg-white border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50"><i className="ph ph-funnel"></i> Filter</button>
                <button className="flex items-center gap-1.5 px-3 py-1.5 bg-white border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50"><i className="ph ph-sort-ascending"></i> Sort</button>
              </div>
            </div>

            <div className="w-9 h-9 rounded-full bg-gray-200 overflow-hidden border border-gray-200 cursor-pointer hover:opacity-80 shrink-0">
              <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" alt="User Avatar" className="w-full h-full object-cover" />
            </div>
          </header>

          <main className="max-w-6xl mx-auto w-full px-4 py-6">
            <div className="mb-6">
              <button className="text-blue-600 hover:text-blue-800 text-sm font-medium flex items-center gap-1.5"><i className="ph-bold ph-arrow-left"></i> back to My Trips</button>
            </div>

            <div className="flex flex-col lg:flex-row gap-6 mb-8">
              <div className="bg-white border border-gray-200 rounded-xl shadow-sm p-6 lg:w-2/3 flex flex-col sm:flex-row gap-6 items-start">
                <div className="w-full sm:w-40 h-32 sm:h-auto sm:self-stretch rounded-lg overflow-hidden shrink-0 bg-gray-100 border border-gray-200">
                  <img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=400&q=80" alt="Paris" className="w-full h-full object-cover" />
                </div>
                <div className="flex-1 flex flex-col">
                  <div className="mb-4">
                    <h1 className="text-2xl font-bold text-gray-900 mb-1">Trip to Europe Adventure</h1>
                    <p className="text-sm font-medium text-gray-500">May 30 - Jun 05, 2025 • 4 cities</p>
                  </div>
                  <div className="grid grid-cols-2 gap-y-3 gap-x-6 mb-5 bg-gray-50 rounded-lg p-4 border border-gray-100">
                    <div>
                      <span className="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-0.5">Invoice ID</span>
                      <span className="text-sm font-semibold text-gray-800">INV-xyz-30290</span>
                    </div>
                    <div>
                      <span className="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-0.5">Generated Date</span>
                      <span className="text-sm font-semibold text-gray-800">May 20, 2025</span>
                    </div>
                    <div className="col-span-2 sm:col-span-1">
                      <span className="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Status</span>
                      <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold bg-yellow-100 text-yellow-800 border border-yellow-200">
                        <span className="w-1.5 h-1.5 rounded-full bg-yellow-500"></span> Pending
                      </span>
                    </div>
                  </div>
                  <div>
                    <span className="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Travelers</span>
                    <div className="flex flex-wrap gap-2 text-sm font-medium text-gray-700">
                      <span className="bg-gray-100 px-2 py-1 rounded">James</span>
                      <span className="bg-gray-100 px-2 py-1 rounded">Arjun</span>
                      <span className="bg-gray-100 px-2 py-1 rounded">Jerry</span>
                      <span className="bg-gray-100 px-2 py-1 rounded">Cristina</span>
                    </div>
                  </div>
                </div>
              </div>

              <div className="bg-white border border-gray-200 rounded-xl shadow-sm p-6 lg:w-1/3 flex flex-col">
                <h2 className="text-lg font-bold text-gray-900 mb-4">Budget Insights</h2>
                <div className="flex items-center gap-4 mb-6">
                  <div className="w-20 h-20 shrink-0">
                    <ResponsiveContainer width="100%" height="100%">
                      <PieChart>
                        <Pie data={budgetData} cx="50%" cy="50%" innerRadius={28} outerRadius={40} startAngle={90} endAngle={-270} dataKey="value" stroke="none">
                          {budgetData.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.color} />)}
                        </Pie>
                        <Tooltip contentStyle={{ borderRadius: '8px', border: '1px solid #e5e7eb', fontSize: '12px', padding: '4px 8px' }} />
                      </PieChart>
                    </ResponsiveContainer>
                  </div>
                  <div className="flex flex-col gap-1.5">
                    <div className="flex justify-between gap-4 text-sm">
                      <span className="text-gray-500">Total Budget:</span>
                      <span className="font-semibold text-gray-900">$20,000</span>
                    </div>
                    <div className="flex justify-between gap-4 text-sm">
                      <span className="text-gray-500">Total Spent:</span>
                      <span className="font-semibold text-gray-900">$22,000</span>
                    </div>
                    <div className="flex justify-between gap-4 text-sm pt-1.5 border-t border-gray-100">
                      <span className="text-gray-500 font-medium">Remaining:</span>
                      <span className="font-bold text-red-600">-$2,000</span>
                    </div>
                  </div>
                </div>
                <button className="mt-auto w-full flex items-center justify-center py-2 bg-white border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
                  View Full Budget
                </button>
              </div>
            </div>

            <div className="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden mb-8">
              <div className="overflow-x-auto">
                <table className="min-w-full divide-y divide-gray-200">
                  <thead className="bg-gray-50">
                    <tr>
                      <th scope="col" className="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider w-12">#</th>
                      <th scope="col" className="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Category</th>
                      <th scope="col" className="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Description</th>
                      <th scope="col" className="px-6 py-4 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Qty/details</th>
                      <th scope="col" className="px-6 py-4 text-right text-xs font-bold text-gray-500 uppercase tracking-wider">Unit Cost</th>
                      <th scope="col" className="px-6 py-4 text-right text-xs font-bold text-gray-500 uppercase tracking-wider">Amount</th>
                    </tr>
                  </thead>
                  <tbody className="bg-white divide-y divide-gray-100">
                    {invoiceItems.map((item) => (
                      <tr key={item.id} className="hover:bg-gray-50 transition-colors">
                        <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-500">{item.id}</td>
                        <td className="px-6 py-4 whitespace-nowrap"><span className="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-medium bg-blue-50 text-blue-700 border border-blue-100 capitalize">{item.category}</span></td>
                        <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{item.desc}</td>
                        <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-center">{item.qty}</td>
                        <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-900 text-right">{item.unit}</td>
                        <td className="px-6 py-4 whitespace-nowrap text-sm font-bold text-gray-900 text-right">{item.amount}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div className="bg-gray-50 border-t border-gray-200 px-6 py-6 flex justify-end">
                <div className="w-full sm:w-64 space-y-3">
                  <div className="flex justify-between text-sm">
                    <span className="font-medium text-gray-600">Subtotal</span>
                    <span className="font-semibold text-gray-900">$21,000.00</span>
                  </div>
                  <div className="flex justify-between text-sm">
                    <span className="font-medium text-gray-600">Tax 5%</span>
                    <span className="font-semibold text-gray-900">$1,050.00</span>
                  </div>
                  <div className="flex justify-between text-sm">
                    <span className="font-medium text-gray-600">Discount</span>
                    <span className="font-semibold text-gray-900">-$50.00</span>
                  </div>
                  <div className="flex justify-between pt-3 border-t border-gray-300">
                    <span className="text-base font-bold text-gray-900">Grand Total</span>
                    <span className="text-xl font-bold text-gray-900">$22,000.00</span>
                  </div>
                </div>
              </div>
            </div>
          </main>

          <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40">
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3 w-full sm:w-auto">
                <button className="flex-1 sm:flex-none flex items-center justify-center gap-2 px-5 py-2.5 bg-white border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50"><i className="ph ph-download-simple text-lg"></i> Download Invoice</button>
                <button className="flex-1 sm:flex-none flex items-center justify-center gap-2 px-5 py-2.5 bg-white border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50"><i className="ph ph-file-pdf text-lg"></i> Export as PDF</button>
              </div>
              <button className="w-full sm:w-auto flex items-center justify-center gap-2 px-8 py-2.5 bg-blue-600 text-white rounded-md text-sm font-medium hover:bg-blue-700 shadow-sm"><i className="ph-bold ph-check"></i> Mark as paid</button>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<InvoiceBilling />);
  </script>
</body>
</html>
